# Portal wrangler config — the Muse Hackathon portal (Option B).
#
# ADOPTED by Panel B1 as `wrangler.toml` at the ROOT of the union tree
# (~/workspace/musehackathon-union, branch sandbox/portal-union), from
# Panel B2's candidate (portal-b-2026-10-31/b2/wrangler.portal.toml),
# verbatim except this header. It REPLACES the workbench-era wrangler.toml
# inherited from the Entire tree, whose header said the rest of the Pages
# config "is owned by the port target" — this file is that port target config.
#
# Provenance of each setting:
# - Build output `dist`: the CivicScope app's Vite build (`npm run build` =
#   tsc -b && vite build && tools/gen-seo.mjs) writes dist/. The existing
#   civicscope production + preview were deployed with NO wrangler.toml at
#   all, using `wrangler pages deploy dist --project-name civicscope`
#   (package.json scripts + docs/submission-path-deploy.md, 2026-10-30).
# - Compatibility date: the no-config deploys ran under wrangler's default
#   for their deploy date; 2025-10-30 pins the runtime era the submission
#   preview was verified under, instead of letting the default drift.
# - METER Durable Object: binding name and class name carried from the
#   Entire tree's wrangler.toml. One named instance ('judging-window-v1',
#   in functions/api/muse/meter-do.ts) is the single Q1 aggregate counter
#   store. Two Pages-specific corrections (deploy-fix, 2026-10-31):
#   Pages config does not support "migrations" (validation aborts the
#   deploy), so the block is gone — a Pages deployment registers the
#   class from the worker bundle's export, no migration step exists;
#   and Pages requires a Durable Object binding to name the Worker that
#   defines the class ("script_name"), which for this project is its
#   own Pages worker script (names only, from the project record).
# - Local dev note (measured 2026-10-31): under `wrangler pages dev` a
#   script_name binding is cross-script, so the binding shows
#   [not connected] and meter calls fail closed (diagnostics 503
#   breaker_open) until the defining script also runs locally — a
#   second `wrangler dev` serving dist/_worker.js under the production
#   script name, with the class registered by a binding in its own
#   config. With that host up, pages dev shows [connected] and the
#   meter hop answers. A single local process cannot show the durable
#   path; that is a local-dev property, not a deployment property.

name = "civicscope-muse-portal"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-30"

[durable_objects]
bindings = [
  { name = "METER", class_name = "MeterDurableObject", script_name = "pages-worker--22936400-production" }
]

# Preview deployments: a preview deploy targets the project's preview
# worker script, whose name differs from production's only in the final
# segment. Wrangler selects the [env.preview] section for non-production
# branches, so the preview binding names the preview script and each
# environment's meter store stays inside its own script.
[env.preview.durable_objects]
bindings = [
  { name = "METER", class_name = "MeterDurableObject", script_name = "pages-worker--22936400-preview" }
]

# Environment values are set by the OWNER after project creation
# (see deploy-sequence.md) — names only here, never values:
# - MUSE_API_KEY   : server-side secret (`wrangler pages secret put`).
# - CENSUS_APP_KEY : project environment variable, injected at build/serve
#                    time per docs/shared-app-key.md (the judges' shared
#                    application key slot; client-visible by design).
# - MUSE_MODEL     : OPTIONAL plain variable. Leave unset to run the
#                    default model; diagnostics report modelIsDefault true
#                    either way. Set only to pin it explicitly.
#
# [vars]
# MUSE_MODEL = "muse-spark-1.3"
